<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Admin · 7qob</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=6">

  <!-- Saved theme, applied before first paint so a light visitor sees no flash. -->
  <script>
    try {
      if (localStorage.getItem("theme") === "light") {
        document.documentElement.classList.add("light");
      }
    } catch (e) {}
  </script>
</head>
<body class="is-single is-admin">

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="index.html">7qob</a>
      <span class="tools">
        <button class="tool" type="button" id="lang-toggle" aria-label="Auf Deutsch umschalten">DE</button>
        <button class="tool" type="button" id="theme-toggle" aria-label="Toggle dark/bright" aria-pressed="false">
          <span data-theme-icon>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </button>
      </span>
    </div>
  </header>

  <main aria-labelledby="page-title">
   <div class="col admin">
    <section class="section section--top">
      <h1 class="hero__title" id="page-title">Admin</h1>
      <div class="prose"><p>Write the site, and see who has been in it.</p></div>
    </section>

    <p class="box__text" id="admin-gate">Checking your session…</p>

    <div id="admin-body" hidden>

      <div class="admin-tabs" role="tablist" aria-label="Admin sections" id="admin-sections">
        <button class="admin-tab" role="tab" type="button" id="tab-projects" aria-selected="true"  aria-controls="panel-projects" data-panel="projects">Projects<small>write and publish pages</small></button>
        <button class="admin-tab" role="tab" type="button" id="tab-home"     aria-selected="false" aria-controls="panel-home"     data-panel="home" tabindex="-1">Home page<small>what sits where</small></button>
        <button class="admin-tab" role="tab" type="button" id="tab-files"    aria-selected="false" aria-controls="panel-files"    data-panel="files" tabindex="-1">Files<small>uploads and documents</small></button>
        <button class="admin-tab" role="tab" type="button" id="tab-access"   aria-selected="false" aria-controls="panel-access"   data-panel="access" tabindex="-1">Access<small>accounts and telemetry</small></button>
      </div>

      <section class="admin-panel" id="panel-projects" role="tabpanel" aria-labelledby="tab-projects" data-panel="projects">

        <div class="pe" id="projects-list">

          <section class="pe-card">
            <span class="pe-card__label">New page</span>
            <form class="admin-form" id="create-project-form">
              <label class="pe-field pe-field--wide">
                <span class="pe-field__label">Title</span>
                <input class="admin-input pe-input--title" id="new-project-title" name="title" type="text" required maxlength="120">
              </label>
              <div class="pe-field">
                <button class="admin-btn admin-btn--accent" type="submit">Create and open</button>
              </div>
            </form>
          </section>

          <section class="pe-card">
            <span class="pe-card__label">Pages</span>
            <div class="admin-scroll"><table class="admin-table" id="projects-table"></table></div>
          </section>
        </div>

        <div id="project-editor" hidden></div>

      </section>

      <section class="admin-panel" id="panel-home" role="tabpanel" aria-labelledby="tab-home" data-panel="home" hidden>
        <div class="pe" id="home-editor"></div>
      </section>

      <section class="admin-panel" id="panel-files" role="tabpanel" aria-labelledby="tab-files" data-panel="files" hidden>
        <div class="pe">

          <section class="pe-card">
            <span class="pe-card__label">Uploads · public</span>
            <div class="pe-drop">
              <label class="pe-check">
                <input type="file" id="media-upload" multiple accept="image/png,image/jpeg,image/webp,image/gif,video/mp4">
              </label>
            </div>
            <div class="admin-scroll"><table class="admin-table" id="media-table"></table></div>
          </section>

          <section class="pe-card">
            <span class="pe-card__label">Vault documents · private</span>

            <form class="admin-form" id="create-document-form">
              <label class="pe-field">
                <span class="pe-field__label">Title</span>
                <input class="admin-input" id="new-document-title" name="title" type="text" required maxlength="120">
              </label>
              <div class="pe-field">
                <button class="admin-btn admin-btn--accent" type="submit">Create document</button>
              </div>
            </form>

            <p class="pe-field__hint">Upload each PDF from its row.</p>
            <div class="admin-scroll"><table class="admin-table" id="documents-table"></table></div>
          </section>

        </div>
      </section>

      <section class="admin-panel" id="panel-access" role="tabpanel" aria-labelledby="tab-access" data-panel="access" hidden>
        <div class="pe">

          <section class="pe-card">
            <span class="pe-card__label">Right now</span>
            <div class="admin-stats" id="overview-stats"></div>
            <p class="admin-note" id="overview-retention"></p>
          </section>

          <section class="pe-card">
            <span class="pe-card__label">Accounts</span>

            <form class="admin-form" id="create-user-form">
              <label class="pe-field">
                <span class="pe-field__label">Username</span>
                <input class="admin-input" id="new-username" name="username" type="text" required
                       autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="32">
              </label>
              <label class="pe-field">
                <span class="pe-field__label">Issued to (optional)</span>
                <input class="admin-input" id="new-note" name="note" type="text" maxlength="200">
              </label>
              <label class="pe-field">
                <span class="pe-field__label">Role</span>
                <select class="admin-input" id="new-role" name="role">
                  <option value="user" selected>User: vault only</option>
                  <option value="admin">Admin: vault and this panel</option>
                </select>
              </label>
              <div class="pe-field">
                <button class="admin-btn admin-btn--accent" type="submit">Issue a login</button>
              </div>
            </form>

            <div class="admin-secret" id="new-credentials" hidden></div>

            <div class="admin-scroll"><table class="admin-table" id="users-table"></table></div>
          </section>

          <section class="pe-card">
            <span class="pe-card__label">Telemetry</span>

            <div class="admin-tabs" role="tablist" aria-label="Telemetry" id="telemetry-tabs">
              <button class="admin-tab" role="tab" type="button" id="tab-logins"    aria-selected="true"  aria-controls="panel-logins"    data-panel="logins">Logins</button>
              <button class="admin-tab" role="tab" type="button" id="tab-sessions"  aria-selected="false" aria-controls="panel-sessions"  data-panel="sessions" tabindex="-1">Sessions</button>
              <button class="admin-tab" role="tab" type="button" id="tab-downloads" aria-selected="false" aria-controls="panel-downloads" data-panel="downloads" tabindex="-1">Downloads</button>
              <button class="admin-tab" role="tab" type="button" id="tab-audit"     aria-selected="false" aria-controls="panel-audit"     data-panel="audit" tabindex="-1">Audit</button>
            </div>

            <div id="panel-logins" role="tabpanel" aria-labelledby="tab-logins" data-panel="logins">
              <div class="admin-scroll"><table class="admin-table" id="logins-table"></table></div>
            </div>
            <div id="panel-sessions" role="tabpanel" aria-labelledby="tab-sessions" data-panel="sessions" hidden>
              <div class="admin-scroll"><table class="admin-table" id="sessions-table"></table></div>
            </div>
            <div id="panel-downloads" role="tabpanel" aria-labelledby="tab-downloads" data-panel="downloads" hidden>
              <div class="admin-scroll"><table class="admin-table" id="downloads-table"></table></div>
            </div>
            <div id="panel-audit" role="tabpanel" aria-labelledby="tab-audit" data-panel="audit" hidden>
              <div class="admin-scroll"><table class="admin-table" id="audit-table"></table></div>
            </div>
          </section>

        </div>
      </section>

    </div>

   </div>
  </main>

  <footer class="pagefoot">
    <div class="pagefoot__inner">
      <span>7qob &middot; v2.0.0</span>
      <a href="impressum.html" data-de="Impressum und Datenschutz">Impressum and privacy</a>
    </div>
  </footer>

  <script src="script.js?v=6"></script>
  <script src="admin.js?v=6"></script>
</body>
</html>
