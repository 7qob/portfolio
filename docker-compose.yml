# Runs on the Pi. `docker compose pull && docker compose up -d` after CI has
# published a new image; nothing is ever built here.

services:
  api:
    image: ghcr.io/7qob/portfolio-api:latest
    container_name: portfolio-api
    restart: unless-stopped

    # Published to loopback ONLY. Without the 127.0.0.1 prefix Docker would
    # bind 0.0.0.0 and — because it writes its own iptables rules — punch
    # straight through the host firewall, putting the API on the LAN. nginx is
    # the only thing that should ever reach it.
    ports:
      - "127.0.0.1:8080:8080"

    environment:
      NODE_ENV: production
      PORT: "8080"
      DB_PATH: /data/app.db
      VAULT_FILES_DIR: /vault-files
      PAGES_DIR: /site/pages
      MEDIA_DIR: /site/assets/up

      # The hand-written home page, used as the base for the generated one
      # until PAGES_DIR/index.html exists. Read-only: Publish writes its
      # output to PAGES_DIR and never back over the template.
      HOME_TEMPLATE: /site/index.html

    volumes:
      # The database. Lives on the host so pulling a new image never touches
      # accounts or logs.
      - /var/lib/kira1q/data:/data

      # The documents. Writable since the panel's Documents tab took over
      # uploads: the service stores <slug>.pdf here itself (magic bytes
      # checked, name derived server-side). Still outside the web root, still
      # only ever streamed through a session check.
      - /var/lib/kira1q/vault-files:/vault-files

      # The two writable holes in an otherwise read-only container: where
      # Publish renders project pages, and where the panel's uploads land.
      # Unlike vault files these belong inside the web root, because both are
      # ordinary public assets that nginx serves directly.
      #
      # Both host directories MUST exist and be owned by uid 1000 (the `node`
      # user in the image) before the first `up -d`. Docker creates a missing
      # bind-mount source as root:root, and the container would then fail
      # every publish and every upload with EACCES. setup-pi.sh creates them;
      # if you brought this up by hand, so must you:
      #
      #   sudo install -d -o 1000 -g 1000 -m 755 \
      #     /var/www/kira1q.dev/pages /var/www/kira1q.dev/assets/up
      #
      # 755 is what lets www-data read what uid 1000 wrote.
      - /var/www/kira1q.dev/pages:/site/pages
      - /var/www/kira1q.dev/assets/up:/site/assets/up

      # The home page the deploy rsyncs, read-only. It is the template the
      # renderer splices project cards into, not the file visitors get —
      # nginx prefers /pages/index.html the moment one exists (see the
      # `location = /` block in deploy/nginx-kira1q.dev.conf).
      - /var/www/kira1q.dev/index.html:/site/index.html:ro

    # Nothing in here writes outside the mounts above.
    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
