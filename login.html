<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · 7qob</title>

  <!-- No Open Graph. A sign-in page should never render a link preview. -->

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='.5' y='.5' width='31' height='31' fill='%230e0e0e' stroke='%232a2a2a'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%23ff1e2f'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">

  <!-- Saved theme, applied before first paint so a light visitor sees no flash. -->
  <script>
    try {
      if (localStorage.getItem("theme") === "light") {
        document.documentElement.classList.add("light");
      }
    } catch (e) {}
  </script>
</head>
<body>

  <header class="site-header">
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="vault/index.html">Vault</a>
    </nav>
    <button class="icon-btn" type="button" id="theme-toggle" aria-label="Toggle dark/bright" aria-pressed="false">
      <span data-theme-icon>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
    </button>
  </header>

  <div class="page-head">
    <h1 class="page-head__title" id="page-title">Sign in</h1>
    <p class="page-head__lede">The Vault is private. Access is by invitation.</p>
  </div>

  <main class="page-body" aria-labelledby="page-title">

    <section class="box box--static box--narrow" aria-labelledby="lbl-signin">
      <h2 class="box__label" id="lbl-signin"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Credentials</h2>

      <form class="auth-form" id="login-form" method="post" action="/api/auth/login" novalidate>

        <div class="auth-field">
          <label class="auth-field__label" for="username">Username</label>
          <input class="auth-field__input" id="username" name="username" type="text"
                 required autocomplete="username" autocapitalize="none"
                 autocorrect="off" spellcheck="false">
        </div>

        <div class="auth-field">
          <label class="auth-field__label" for="password">Password</label>
          <input class="auth-field__input" id="password" name="password" type="password"
                 required autocomplete="current-password">
        </div>

        <p class="auth-error" id="login-error" role="alert" hidden></p>

        <button class="auth-submit" type="submit" id="login-submit">Sign in</button>
      </form>

      <p class="box__text auth-note">Credentials are issued by me and are not self-service. If you need access, or yours has stopped working, <a href="mailto:matti.naef@bwdbern.ch">email me</a>.</p>
    </section>

  </main>

  <footer class="site-footer">
    <span class="site-footer__meta">&copy; <span id="year"></span> 7qob &middot; v1.0.0</span>
    <a href="impressum.html">Impressum</a>
    <a href="https://github.com/7qob" target="_blank" rel="noopener">GitHub<svg class="footer-arrow" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg></a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
