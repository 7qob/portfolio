# Rate limiting for the API.
#
# Install on the Pi as /etc/nginx/conf.d/7qob-ratelimit.conf — NOT in
# sites-available. limit_req_zone is an http-level directive and nginx refuses
# to start if it appears inside a server block.
#
#   sudo cp deploy/nginx-conf.d-7qob.conf /etc/nginx/conf.d/7qob-ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Optional. If you skip it, comment out the two limit_req lines in the
# location ^~ /api/ block, or nginx will fail its config test with
# "unknown limit_req zone".
#
# Why bother when the service already rate-limits per IP and per username:
# that check runs *inside* the application, which means a flood still reaches
# Node and still costs a request each. Login verification is argon2 at 19 MiB
# a time — deliberately expensive, which is the right property against a
# password guesser and the wrong one against a flood. On a Pi that becomes a
# memory problem well before it becomes a brute-force problem. This stops the
# flood at nginx, for a few kilobytes of state.
#
# Keyed on the true client address from Cloudflare rather than $remote_addr,
# which through the tunnel is always 127.0.0.1 — keying on that would rate
# limit every visitor as if they were one person.

map $http_cf_connecting_ip $site_client {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# 10 requests/second sustained, with burst=10 nodelay in the location block.
# Generous for a human — the admin panel fetches seven endpoints when you open
# it — and nowhere near enough for a guessing script.
limit_req_zone $site_client zone=api_login:1m rate=10r/s;
